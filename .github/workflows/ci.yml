name: Library checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['26.13.1', '24.22.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: 1.7.0
          node-version: ${{ matrix.node }}
          run-install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @1hubengineering/receipt-verifier-provider-cbe exec playwright install --with-deps chromium
      - name: Allow namespaces for pinned Chromium executables
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          setting = Path('/proc/sys/kernel/apparmor_restrict_unprivileged_userns')
          if setting.exists() and setting.read_text().strip() == '1':
              cache = Path.home() / '.cache/ms-playwright'
              roots = [cache / 'chromium-1255', cache / 'chromium_headless_shell-1255']
              browsers = sorted(p.resolve() for root in roots for p in root.rglob('*') if p.is_file() and p.name in {'chrome', 'headless_shell', 'chrome-headless-shell'} and os.access(p, os.X_OK))
              if not browsers:
                  raise RuntimeError('Pinned Chromium executables not found')
              profile = Path(os.environ['RUNNER_TEMP']) / 'receipt-chromium.apparmor'
              blocks = [f'profile receipt-verifier-chromium-{i} "{p}" flags=(unconfined) {{\n  userns,\n}}' for i, p in enumerate(browsers)]
              profile.write_text('abi <abi/4.0>,\ninclude <tunables/global>\n\n' + '\n\n'.join(blocks) + '\n')
              subprocess.run(['sudo', 'apparmor_parser', '-r', str(profile)], check=True)
              print(f'Allowed namespaces for {len(browsers)} pinned browser executables; global restriction stays enabled')
          else:
              print('No AppArmor user-namespace restriction to adjust')
          PY
      - run: pnpm db:up
      - run: pnpm verify
      - if: always()
        run: pnpm db:down
      - name: Remove disposable browser namespace profiles
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/receipt-chromium.apparmor" ]; then
            sudo apparmor_parser -R "$RUNNER_TEMP/receipt-chromium.apparmor"
          fi
