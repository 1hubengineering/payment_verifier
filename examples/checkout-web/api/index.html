<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Search the public TypeScript exports of Payment Verifier 0.2.0."
    />
    <title>API Reference · Payment Verifier</title>
    <link rel="stylesheet" href="../src/site.css" />
  </head>
  <body class="developer-site">
    <!-- developer-nav -->
    <main id="main" class="site-shell api-page" tabindex="-1">
      <p class="section-kicker">RELEASE 0.2.0</p>
      <h1>API reference</h1>
      <p class="page-intro">
        Functions and types from the published package declarations. Each entry shows its import
        path and links to the release source.
      </p>
      <div class="api-toolbar" hidden>
        <label for="api-query">Filter by name, package, or signature</label>
        <input
          id="api-query"
          type="search"
          placeholder="Try createReceiptVerifier"
          autocomplete="off"
        />
        <p data-count role="status"></p>
      </div>
      <!-- api-entries -->
    </main>
    <script type="module" src="../src/api-search.ts"></script>
  </body>
</html>
